[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway"
version = "0.1.0"
description = "A minimal multi-provider LLM gateway: per-token cost metering, usage ledger, fallback routing, and request telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vinicius Campos" }]
keywords = ["llm", "gateway", "cost-metering", "billing", "fallback", "bedrock"]

dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "click>=8.1",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "httpx>=0.27",
  "boto3>=1.34",
]

[project.scripts]
gateway-report = "gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
